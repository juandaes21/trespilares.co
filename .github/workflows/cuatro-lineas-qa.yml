name: QA cuatro líneas - revisión segura

on:
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/cuatro-lineas-qa.yml"
  push:
    branches: [feat/cuatro-lineas-patrimoniales-preview]

permissions:
  contents: read

jobs:
  test:
    name: Sintaxis, simuladores y captación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check backend/crm.js
          node --check backend/server.js
          node --check backend/commercial.js
          node --check backend/commercial-core.js
          node --check backend/crm/app.js
          node --check public/assets/js/calculadoras.js
          node --check public/assets/js/comercial-interes.js
      - name: Ejecutar pruebas sin secretos ni base de datos de producción
        run: node --test tests/*.test.mjs
